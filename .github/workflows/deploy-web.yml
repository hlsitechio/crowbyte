name: Deploy Web

on:
  push:
    branches: [main]
  workflow_dispatch:

# Least-privilege GITHUB_TOKEN: deploy authenticates to Cloudflare with its own
# API token secret, so this workflow only needs read access to check out the repo.
permissions:
  contents: read

jobs:
  deploy:
    name: Deploy Maintenance Page
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy maintenance page to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy apps/desktop/maintenance --project-name=crowbyte --branch=main
